# Aviationsminute Social Media — Nginx reverse proxy template
# Replace YOUR_DOMAIN with the real hostname before enabling.
#
# Public:
#   80 / 443 only
# Private (localhost):
#   Next.js  127.0.0.1:3000
#   Nest API 127.0.0.1:5000
#
# Install:
#   sudo cp deploy/nginx/aviationsminute.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/aviationsminute.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream sma_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream sma_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Certbot paths (adjust if using another issuer)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (safe defaults; CSP left to the apps)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    # Do not aggressively cache analytics HTML/API responses.
    # Static Next assets may be cached below.

    # NestJS API (global prefix /api) — keep /api path intact
    location /api/ {
        proxy_pass http://sma_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Manual YouTube sync can wait up to ~90s on the API
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # WebSocket / future SSE compatibility
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
    }

    # Next.js static assets (immutable hashed files)
    location /_next/static/ {
        proxy_pass http://sma_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js application
    location / {
        proxy_pass http://sma_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# Place in http {} context if not already present:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
